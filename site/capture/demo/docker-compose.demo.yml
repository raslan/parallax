# Demo instance for generating the public site's screenshots/clips (RAS-77). Separate project,
# port and data dir from the real app, so it never touches your actual libraries/settings.
#
#   python3 -P site/capture/demo/demo.py reset                      # build library/ from pristine/
#   docker compose -f site/capture/demo/docker-compose.demo.yml up --build -d
#   python3 -P site/capture/demo/seed.py                            # key, theme, libraries, scans (idempotent)
#   ...capture...
#   docker compose -f site/capture/demo/docker-compose.demo.yml down
#   python3 -P site/capture/demo/demo.py clean                      # remove the temporary library/
#
# data/ (settings, DB, thumbnails) is kept between runs so the TMDB key and models persist.
# It was pre-seeded with ONLY the tool binaries/models copied from the real data/ dir
# (models/nudenet, alass, yt-dlp) — never the real DB, thumbnails, URL lists or archives.
# Delete everything in docs/demo/data except those three to get a blank instance again.
name: parallax-demo

services:
  transcoder:
    build:
      context: ../../..
      args:
        RUNTIME: ${RUNTIME:-cuda}
    ports:
      - "7898:7899"
    volumes:
      # Media, settings and models live in the gitignored docs/demo/, not in site/.
      - ../../../docs/demo/data:/app/data
      - ../../../docs/demo/library:/media
    user: "1000:1000"
    environment:
      - DATA_DIR=/app/data
    restart: "no"
    # Captures only ever run on this machine, whose CPU is slow, so use the GPU (same block as
    # the root compose file).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, graphics, utility]
