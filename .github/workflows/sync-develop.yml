name: Sync develop with main

# release-please's release PR merge lands a `chore(main): release vX.Y.Z`
# commit (plus the CHANGELOG.md update) directly on main — the one commit
# that only ever exists there, since develop -> main is otherwise a plain
# merge (a strict superset). Left unsynced, that gap compounds every
# release and eventually causes CHANGELOG.md merge conflicts the next time
# develop merges into main. This keeps develop caught up automatically
# after every push to main (a release, or a manual develop -> main merge).

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin develop
