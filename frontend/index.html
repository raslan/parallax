<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='3' fill='%23090a0c'/%3E%3Ctext x='2' y='16' font-family='monospace' font-size='15' font-weight='700' fill='%237a83ff'%3EP%3C/text%3E%3Ccircle cx='17' cy='3.5' r='1.2' fill='%237a83ff'/%3E%3Cline x1='17' y1='1' x2='17' y2='6' stroke='%237a83ff' stroke-width='0.7' opacity='0.6'/%3E%3Cline x1='14.5' y1='3.5' x2='19.5' y2='3.5' stroke='%237a83ff' stroke-width='0.7' opacity='0.6'/%3E%3C/svg%3E"
    />
    <script>
      // The server stamps the saved theme on <html>. Without it (dev server), fall back to
      // this browser's copy so the first paint is still themed.
      (function () {
        var root = document.documentElement;
        if (root.hasAttribute("data-theme")) return;
        try {
          var t = localStorage.getItem("parallax-theme");
          if (t) root.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
